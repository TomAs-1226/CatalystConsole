<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Catalyst Console — it reads, it never writes. A telemetry stream arriving at a console panel and going no further. Telemetry, alerts, a 3D field view and readable Driver Station logs. Version 2.0.0, Windows and macOS.">
  <title>Catalyst Console</title>

  <!--
    The same canvas as the library's banner - docs/design.md takes every token in identity.css from
    that drawing, so this is that drawing with this product's subject on it. Ground, key light, rim
    light, the mark, the type scale and the pill are unchanged. What differs is what the line is and
    what it arrives at.

    On the library's banner the line is a trajectory and the subject is a robot driving it. Here the
    line is telemetry and the subject is the panel it arrives at, because that is the whole product:
    a stream comes in and nothing goes back out. The asymmetry is the promise - the tagline names it,
    the drawing does not contradict it, and there is deliberately no arrow leaving the panel.

    The panel is drawn the way Console actually looks: one accent on a monochrome ground, a reading
    rather than a control. 12.4 V is a plausible battery, not a claim about any robot - Console
    never invents a number, so its banner shows the kind of number it displays, at rest.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191a20"/>
      <stop offset="55%" stop-color="#101116"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="keyLight" cx="76%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.19"/>
      <stop offset="45%" stop-color="#e94560" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimLight" cx="16%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- The stream bleeds off the left edge rather than starting on the canvas, so it reads as a
         feed that was already running before anyone opened the window. -->
    <linearGradient id="feed" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="866" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="28%" stop-color="#e94560" stop-opacity="0.40"/>
      <stop offset="68%" stop-color="#ff5d76" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ff6b81" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="feedGlow" gradientUnits="userSpaceOnUse" x1="-20" y1="0" x2="866" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff5d76" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff5d76" stop-opacity="0.42"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tightGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#ground)"/>
  <rect width="1200" height="340" rx="18" fill="url(#keyLight)"/>
  <rect width="1200" height="340" rx="18" fill="url(#rimLight)"/>

  <!-- Kept subtle and oversized: it gives the right half depth without asking to be read. -->
  <text x="1168" y="318" text-anchor="end"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="250" font-weight="700"
        letter-spacing="-13" fill="#ffffff" fill-opacity="0.032">2.0</text>

  <g clip-path="inset(0 round 18)">
    <!-- Telemetry, not a trajectory: it wanders the way a sampled signal does while it trends up
         toward the panel. Two glow passes, the same as the library's route - a wide soft haze for
         the bloom and a tight one on the line, which is what stops it smearing near the panel. -->
    <path id="stream" d="M-20 310 C56 306 96 292 148 296 C204 300 236 312 292 306 C348 300 380 288 436 294 C500 301 536 266 600 250 C662 234 698 208 756 191 C806 177 838 175 862 172"
          fill="none" stroke="url(#feedGlow)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
    <use href="#stream" stroke="url(#feedGlow)" stroke-width="4" filter="url(#tightGlow)"/>
    <use href="#stream" stroke="url(#feed)" stroke-width="3.2"/>

    <!-- Samples on the stream, fading back down it. Console draws points it was sent, so the line
         is made of them rather than passing through a decorative few.

         The stream stays under y=290 until the copy has ended, for the reason identity.css gives
         about the key light: decoration never goes where text is without checking the pair. An
         earlier path climbed sooner and put this second sample inside the word WINDOWS. -->
    <g fill="#ff8fa0">
      <circle cx="148" cy="296" r="2.6" fill-opacity="0.16"/>
      <circle cx="292" cy="306" r="2.8" fill-opacity="0.30"/>
      <circle cx="436" cy="294" r="3"   fill-opacity="0.44"/>
      <circle cx="600" cy="250" r="3.2" fill-opacity="0.60"/>
      <circle cx="756" cy="191" r="3.4" fill-opacity="0.78"/>
    </g>

    <!-- The panel. It arrives here and stops: there is no return path, on the drawing or in the
         binary. -->
    <g transform="translate(980 168)">
      <!-- Contact shadow, so the panel sits in the scene instead of floating over it. -->
      <rect x="-114" y="-70" width="228" height="140" rx="16" fill="#000000" fill-opacity="0.55" filter="url(#drop)"/>

      <rect x="-118" y="-74" width="236" height="148" rx="18" fill="#14151a" stroke="#3d404a" stroke-width="1.4"/>
      <!-- Top edge picking up the same rim light as the card. -->
      <path d="M-104 -73.3 h208" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Receiving. The dot is the only thing on the panel that is not a reading. -->
      <circle cx="-98" cy="-52" r="3.4" fill="#ff5d76"/>
      <text x="-87" y="-48" font-family="Consolas, ui-monospace, monospace" font-size="10"
            font-weight="700" letter-spacing="1.4" fill="#6b6d75">LIVE</text>
      <text x="100" y="-48" text-anchor="end" font-family="Consolas, ui-monospace, monospace"
            font-size="10" font-weight="700" letter-spacing="1.4" fill="#6b6d75">BATTERY</text>

      <!-- The reading. Monochrome, because on Console the accent is reserved for the signal. -->
      <text x="-98" y="0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
            font-size="44" font-weight="600" letter-spacing="-1.4" fill="#e6e7ea">12.4<tspan
            font-size="19" font-weight="500" fill="#83858d" dx="7">V</tspan></text>

      <!-- The same stream, still arriving, drawn where the panel would draw it. -->
      <path d="M-98 46 L-76 38 L-56 51 L-34 30 L-10 41 L14 22 L40 33 L64 18 L88 25 L100 20"
            fill="none" stroke="#ff5d76" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="20" r="3.2" fill="#ff8fa0"/>
    </g>
  </g>

  <!-- The mark -->
  <g transform="translate(76 84) scale(2.5)">
    <path d="M13.5 2 5 13h5l-1.5 9L19 10h-5.5z" fill="#e94560"/>
  </g>

  <text x="138" y="122" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54">
    <tspan font-weight="200" letter-spacing="-1.4" fill="#8d8f97">Catalyst</tspan><tspan
           font-weight="700" letter-spacing="-2.2" fill="#ffffff" dx="14">Console</tspan>
  </text>

  <rect x="140" y="146" width="300" height="1.5" fill="url(#hair)"/>

  <text x="139" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="25" font-weight="600" fill="#e6e7ea">It reads. It never writes.</text>

  <text x="140" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#83858d">Telemetry · Alerts · 3D field · Driver Station logs</text>

  <!-- Version, and the platforms it is built for. -->
  <g transform="translate(140 240)">
    <rect width="96" height="30" rx="15" fill="#e94560" fill-opacity="0.14" stroke="#e94560" stroke-opacity="0.6"/>
    <circle cx="19" cy="15" r="4" fill="#ff5d76"/>
    <text x="33" y="20" font-family="Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#ff92a3">2.0.0</text>
  </g>
  <text x="250" y="260" font-family="Consolas, ui-monospace, monospace" font-size="11" font-weight="700"
        letter-spacing="1.6" fill="#6b6d75">WINDOWS · MACOS</text>
</svg>
