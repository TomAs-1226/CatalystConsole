# Check Catalyst Console and prove it still builds. This workflow does not release.
#
# It used to: a `v*` tag built the installer here and published it. But the field, robot and driver
# models the 3D views draw are baked from CAD on a development machine into src/vendor, which git
# does not track, so a runner has never had them. v2.0.0 was built here anyway, without even three
# or the font, and opened a black window on every computer but the one it was written on. A runner
# can now vendor those two, but a release built here would still replace the real field and robot
# with the fallback drawing on every install that auto-updates.
#
# So a release is built where the models are: `npm run release` on that machine, after
# `devtools release CatalystConsole <version>` and a push. It publishes the signed installer, the
# `latest.json` the console's updater reads, and the bare `catalyst-console.exe` the Catalyst app's
# build fetches. See scripts/release.mjs.
name: Check Catalyst Console

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate. The build below takes minutes, and there is no sense burning that to discover a
  # broken formatter rule that node --test would have caught in a second.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The 3D views import three from src/vendor, which is copied out of node_modules at build time
      # rather than checked in. Without this the gate cannot even load driver3d, hopper3d or park3d.
      - name: Install
        run: npm ci
      - name: Vendor the browser dependencies
        run: npm run vendor
      - name: Test
        run: npm test

  # Not shipped anywhere: this is the proof that a clean checkout compiles and bundles.
  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # build.rs refuses to compile without the vendored files, so this comes before any cargo command.
      - name: Vendor the browser dependencies
        run: npm run vendor

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # No signing key here on purpose, so no updater artefacts: nothing from this job can be
      # mistaken for a release.
      - name: Build the installer
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.ci.conf.json
