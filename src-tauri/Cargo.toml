[package]
name = "catalyst-console"
version = "0.6.0"
description = "Catalyst Console — a driver station companion dashboard"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Exactly one console per machine. Two would mean two NT clients, two windows, and a driver looking
# at whichever one happens to be on top.
tauri-plugin-single-instance = "2"
# In-place updates. A dashboard that can only be upgraded by downloading an installer is a dashboard
# that stays on whatever version was current the week the season started.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NT4 speaks msgpack over a websocket.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rmpv = "1"
rmp-serde = "1"

# Driver Station log tailing.
byteorder = "1"

# Release builds link as a GUI application, which leaves a binary run from a terminal with no console
# to print to. `--help` and `--mcp` borrow the parent's console so they are not silent. Tauri already
# pulls this in, so it costs nothing but the one import.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# A dashboard has no business being large or slow to start.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
